name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # --ignore-scripts: the server's postinstall writes MCP client configs (server/setup.js);
      # CI must never run it.
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix server

      - name: Syntax check and manifest validation
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test (server)
        run: npm test

  package:
    name: package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zip extension/ (Chrome Web Store package)
        id: zip
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          file="neurosquad-browser-mcp-extension-${version}.zip"
          (cd extension && zip -r -X -q "../${file}" .)
          unzip -l "${file}"
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Single stable check for branch protection: stays the same when the jobs change.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$PACKAGE_RESULT" != "success" ]; then
            echo "CI failed: test=$TEST_RESULT package=$PACKAGE_RESULT"
            exit 1
          fi
